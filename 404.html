<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090a15" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="The page you are looking for could not be found." />
  <title>Page Not Found — Kevinn Ramirez</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/404.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
</head>

<body class="error-page-body">
  <header class="error-header">
    <a class="error-logo" href="/" aria-label="Kevinn Ramirez home">KEVINN RAMIREZ</a>
    <span class="error-header-label">PORTFOLIO <span aria-hidden="true">/</span> TOKYO, JP</span>
  </header>

  <main class="error-main">
    <section class="error-card" aria-labelledby="error-title">
      <div class="error-card-topline">
        <span class="error-eyebrow"><span class="error-indicator" aria-hidden="true"></span> ROUTE NOT FOUND</span>
        <span class="error-reference">ERR_404</span>
      </div>

      <div class="error-content">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="error-title">This page is off the map.</h1>
        <p class="error-description">
          The link may be broken, or the page may have moved. Let’s get you back on course.
        </p>

        <nav class="error-actions" aria-label="Error page navigation">
          <a class="error-button error-button-primary" href="/">Back to home <span aria-hidden="true">→</span></a>
          <a class="error-button error-button-secondary" href="/#projects">Explore projects</a>
        </nav>
      </div>

      <div class="error-card-footer">
        <span>STATUS <strong>404</strong></span>
        <span>DESTINATION <strong>UNAVAILABLE</strong></span>
      </div>
    </section>
  </main>

  <footer class="error-footer">
    <span>KEVINN RAMIREZ</span>
    <span>CLOUD ENGINEER <span aria-hidden="true">·</span> AWS CERTIFIED</span>
  </footer>
</body>

</html>
